name: tests

on:
  push:
  pull_request:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Edge-case tests (Node only)
        run: node --test test/
      - name: Cross-check against SciPy / scikit-learn / krippendorff
        run: |
          pip install scipy scikit-learn krippendorff
          python3 test/ref_stats.py | tee out.txt
          grep -q "ALL CHECKS PASS" out.txt
